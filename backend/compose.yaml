services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: noirvale
      POSTGRES_USER: noirvale
      POSTGRES_PASSWORD: noirvale-local-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - noirvale-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noirvale -d noirvale"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  noirvale-postgres-data:
